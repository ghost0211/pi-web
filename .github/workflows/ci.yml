name: web-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      # Full Web fixtures use POSIX launchers/paths. Match desktop release CI:
      # Linux runs the complete suite; Windows keeps typecheck/lint here and
      # validates Rust plus real NSIS installation in desktop-windows.yml.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm test
