name: desktop-windows

# Builds the Windows (NSIS) installer for the Tauri desktop client.
# Trigger manually, or push a version-matching tag like `desktop-v0.9.1` to
# also attach the installer to a GitHub release. Never move a tag once its
# release has been published.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Typecheck web app
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint web app
        run: npm run lint -- --max-warnings=0

      # The shell holds the desktop-only behavior (startup reveal, navigation
      # allow-list); its unit tests run on Windows because `tauri-build` needs
      # the bundled `server/` + `node/` resource directories to exist.
      - name: Rust shell tests
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/server src-tauri/node
          cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const npm=require('./package.json').version; const lock=require('./package-lock.json').version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const cargoLock=fs.readFileSync('src-tauri/Cargo.lock','utf8').match(/name = \"pi-web-desktop\"\r?\nversion = \"([^\"]+)\"/)?.[1]; const expected='desktop-v'+npm; if (process.env.GITHUB_REF_NAME !== expected || [lock,cargo,cargoLock].some(v => v !== npm)) { console.error('Expected '+expected+' with all package/Cargo versions '+npm+', got tag '+process.env.GITHUB_REF_NAME+', lock '+lock+', Cargo '+cargo+', Cargo.lock '+cargoLock); process.exit(1); }"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri build` runs `npm run desktop:server` first (beforeBuildCommand),
      # which produces the Next.js standalone build and downloads the pinned
      # Windows Node.js runtime into src-tauri/resources/.
      - name: Build the signed desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY Actions secret; refusing to publish an unsigned updater.' }
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node scripts/create-desktop-update-manifest.mjs

      - name: Upload NSIS installer and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/desktop-latest.json

      # Keep /releases/latest on the previous signed release until all three
      # assets have finished uploading; do not serve a half-published update.
      - name: Publish signed desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=src-tauri/target/release/bundle/nsis
          exe="$dir/Pi Web Desktop_${GITHUB_REF_NAME#desktop-v}_x64-setup.exe"
          test -s "$exe" && test -s "$exe.sig" && test -s "$dir/desktop-latest.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if [[ $(cat draft-state.txt) != true ]]; then
              echo 'Refusing to overwrite an already published release' >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$exe" "$exe.sig" "$dir/desktop-latest.json" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$exe" "$exe.sig" "$dir/desktop-latest.json" \
              --draft --verify-tag --title "Pi Web Desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
