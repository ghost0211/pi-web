name: desktop-windows

# Builds the desktop installers: Windows (NSIS) and Linux (AppImage + deb) for
# the Tauri desktop client. Trigger manually, or push a version-matching tag
# like `desktop-v0.9.1` to also attach the installers to a GitHub release.
# Never move a tag once its release has been published.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Full Web checks are Linux-validated; several fixtures rely on POSIX.
      # Windows validates the Rust shell and the compiled NSIS upgrade hook.
      - name: Test web app
        if: matrix.os == 'ubuntu-latest'
        run: npm test

      - name: Typecheck web app
        if: matrix.os == 'ubuntu-latest'
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint web app
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint -- --max-warnings=0

      # The shell holds the desktop-only behavior (startup reveal, navigation
      # allow-list); its unit tests run on Windows because `tauri-build` needs
      # the bundled `server/` + `node/` resource directories to exist.
      - name: Rust shell tests
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/server src-tauri/node
          cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const npm=require('./package.json').version; const lock=require('./package-lock.json').version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const cargoLock=fs.readFileSync('src-tauri/Cargo.lock','utf8').match(/name = \"pi-web-desktop\"\r?\nversion = \"([^\"]+)\"/)?.[1]; const expected='desktop-v'+npm; if (process.env.GITHUB_REF_NAME !== expected || [lock,cargo,cargoLock].some(v => v !== npm)) { console.error('Expected '+expected+' with all package/Cargo versions '+npm+', got tag '+process.env.GITHUB_REF_NAME+', lock '+lock+', Cargo '+cargo+', Cargo.lock '+cargoLock); process.exit(1); }"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri build` runs `npm run desktop:server` first (beforeBuildCommand),
      # which produces the Next.js standalone build and downloads the pinned
      # Node.js runtime for this platform into src-tauri/node/.
      - name: Build the signed desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY Actions secret; refusing to publish an unsigned updater.' }
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tauri downloads NSIS during the build. Require it here so the real
      # upgrade/rollback regressions cannot silently skip before publication.
      - name: Test NSIS upgrade and rollback
        shell: pwsh
        run: |
          $env:PI_WEB_TEST_MAKENSIS = Join-Path $env:LOCALAPPDATA 'tauri\NSIS\makensis.exe'
          if (-not (Test-Path $env:PI_WEB_TEST_MAKENSIS)) { throw 'NSIS compiler missing; refusing to skip installer regressions.' }
          node --test desktop-installer.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const npm=require('./package.json').version; const lock=require('./package-lock.json').version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const cargoLock=fs.readFileSync('src-tauri/Cargo.lock','utf8').match(/name = \"pi-web-desktop\"\r?\nversion = \"([^\"]+)\"/)?.[1]; const expected='desktop-v'+npm; if (process.env.GITHUB_REF_NAME !== expected || [lock,cargo,cargoLock].some(v => v !== npm)) { console.error('Expected '+expected+' with all package/Cargo versions '+npm+', got tag '+process.env.GITHUB_REF_NAME+', lock '+lock+', Cargo '+cargo+', Cargo.lock '+cargoLock); process.exit(1); }"

      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same beforeBuildCommand as Windows; build-desktop-server now downloads
      # the Linux Node.js runtime (bin/node) for the sidecar.
      - name: Build the Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY Actions secret; refusing to publish an unsigned updater.' >&2
            exit 1
          fi
          npm run desktop:build

      - name: Upload Linux bundles and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

  # One release carries every platform. It only starts once both installers
  # exist, so a half-published update can never be served to a client.
  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          name: pi-web-windows-nsis
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: pi-web-linux
          path: dist/linux

      - name: Generate the multi-platform updater manifest
        run: |
          mkdir -p dist/manifest
          cp dist/windows/*.exe* dist/manifest/ 2>/dev/null || true
          cp dist/linux/*.AppImage* dist/manifest/ 2>/dev/null || true
          node scripts/create-desktop-update-manifest.mjs dist/manifest

      - name: Publish signed desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          win="dist/windows/Pi Web Desktop_${version}_x64-setup.exe"
          linux_app=$(ls dist/linux/*x86_64*.AppImage 2>/dev/null | head -1 || true)
          manifest="dist/manifest/desktop-latest.json"
          test -s "$win" && test -s "$win.sig"
          test -n "$linux_app" && test -s "$linux_app.sig"
          test -s "$manifest"
          notes_file="docs/releases/v${version}.md"
          notes_args=(--generate-notes)
          if test -s "$notes_file"; then
            notes_args=(--notes-file "$notes_file")
          fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if [[ $(cat draft-state.txt) != true ]]; then
              echo 'Refusing to overwrite an already published release' >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" \
              "$win" "$win.sig" \
              "$linux_app" "$linux_app.sig" \
              dist/linux/*.deb \
              "$manifest" --clobber
            if test -s "$notes_file"; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              "$win" "$win.sig" \
              "$linux_app" "$linux_app.sig" \
              dist/linux/*.deb \
              "$manifest" \
              --draft --verify-tag --title "Pi Web Desktop ${version}" "${notes_args[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
