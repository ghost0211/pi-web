name: desktop-windows

# Builds the Windows (NSIS) installer for the Tauri desktop client.
# Trigger manually, or push a tag like `desktop-v0.9.0` to also attach the
# installer to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri build` runs `npm run desktop:server` first (beforeBuildCommand),
      # which produces the Next.js standalone build and downloads the pinned
      # Windows Node.js runtime into src-tauri/resources/.
      - name: Build the desktop installer
        run: npm run desktop:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
