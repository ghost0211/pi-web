name: desktop-windows

# Builds the Windows (NSIS) installer for the Tauri desktop client.
# Trigger manually, or push a version-matching tag like `desktop-v0.9.1` to
# also attach the installer to a GitHub release. Never move an existing tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const npm=require('./package.json').version; const lock=require('./package-lock.json').version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const cargoLock=fs.readFileSync('src-tauri/Cargo.lock','utf8').match(/name = \"pi-web-desktop\"\r?\nversion = \"([^\"]+)\"/)?.[1]; const expected='desktop-v'+npm; if (process.env.GITHUB_REF_NAME !== expected || [lock,cargo,cargoLock].some(v => v !== npm)) { console.error('Expected '+expected+' with all package/Cargo versions '+npm+', got tag '+process.env.GITHUB_REF_NAME+', lock '+lock+', Cargo '+cargo+', Cargo.lock '+cargoLock); process.exit(1); }"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Typecheck web app
        run: node_modules/.bin/tsc --noEmit

      - name: Lint web app
        run: npm run lint

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri build` runs `npm run desktop:server` first (beforeBuildCommand),
      # which produces the Next.js standalone build and downloads the pinned
      # Windows Node.js runtime into src-tauri/resources/.
      - name: Build the desktop installer
        run: npm run desktop:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
