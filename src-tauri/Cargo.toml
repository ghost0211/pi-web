[package]
name = "pi-web-desktop"
version = "0.9.14"
description = "Windows desktop client for pi-web"
authors = ["pi-web contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `shellexecute-on-windows` makes `open` call ShellExecuteExW directly (the
# double-click behavior) instead of spawning PowerShell `Start-Process`, which
# removes ~0.5s of latency from "open with the system app" and link handling.
open = { version = "5.4.0", features = ["shellexecute-on-windows"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[features]
# `tauri dev` runs with `--no-default-features` because devUrl points at the
# Next.js dev server; release builds bundle the loading page and serve it over
# the tauri:// custom protocol.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
strip = true
opt-level = "s"
lto = true
codegen-units = 1
