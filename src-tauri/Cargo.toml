[package]
name = "pi-web-desktop"
version = "0.9.4"
description = "Windows desktop client for pi-web"
authors = ["pi-web contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[features]
# `tauri dev` runs with `--no-default-features` because devUrl points at the
# Next.js dev server; release builds bundle the loading page and serve it over
# the tauri:// custom protocol.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
strip = true
opt-level = "s"
lto = true
codegen-units = 1
